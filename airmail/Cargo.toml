[package]
name = "airmail"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
levenshtein_automata = "0.2.1"
s2 = "0.0.12"
tempfile = "3.9.0"
log = "0.4.20"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.11.24", features = ["blocking"] }
lru = "0.12.2"
async-trait = "0.1.77"
tokio = { version = "1.36.0", features = ["full"] }
nix = { version = "0.27", features = ["ioctl", "mman"] }
futures-util = "0.3.30"
deunicode = "1.4.3"
itertools = "0.12.1"
lingua = { version = "1.6.2", default-features = false, features = [
    "english",
    "chinese",
    "catalan",
    "arabic",
    "danish",
    "dutch",
    "finnish",
    "french",
    "german",
    "greek",
    "hungarian",
    "italian",
    "portuguese",
    "romanian",
    "russian",
    "spanish",
    "swedish",
    "tamil",
    "turkish",
] }
unicode-segmentation = "1.11.0"
lazy_static = "1.4.0"
regex = "1.10.3"
geo = "0.27.0"
anyhow = "1.0.86"
thiserror = "1.0.63"
roaring = "0.11.2"
zeekstd = "0.5.1"
fst = "0.4.7"

[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "postgres"]

[features]
default = ["build_index"]
invasive_logging = []
build_index = []
